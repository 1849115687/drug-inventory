name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor dependencies
        run: npm ci

      - name: Add Android platform (idempotent)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Inject crash catcher into MainActivity (diagnose scan crash)
        run: python3 scripts/patch-crashcatcher.py

      - name: Bump minSdkVersion for barcode scanner plugin (requires 26)
        run: |
          sed -i 's/minSdkVersion = [0-9][0-9]*/minSdkVersion = 26/' android/variables.gradle
          grep -q "minSdkVersion = 26" android/variables.gradle

      - name: Inject CAMERA permission into AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|&\n    <uses-permission android:name="android.permission.CAMERA" />|' "$MANIFEST"
          fi
          grep -q "android.permission.CAMERA" "$MANIFEST"

      - name: Add JitPack repository for barcode scanner dependency
        run: |
          sed -i 's|mavenCentral()|mavenCentral()\n        maven { url "https://jitpack.io" }|' android/build.gradle
          grep -q "jitpack" android/build.gradle

      - name: Neutralize plugin custom gradle (AAR dependency moved to app module)
        run: |
          : > node_modules/phonegap-plugin-barcodescanner/src/android/barcodescanner.gradle
          ! grep -q "compile(" node_modules/phonegap-plugin-barcodescanner/src/android/barcodescanner.gradle

      - name: Remove legacy support-v4 dependency from plugin (AndroidX conflict)
        run: |
          sed -i '/com.android.support:support-v4/d' node_modules/phonegap-plugin-barcodescanner/plugin.xml
          ! grep -q "com.android.support:support-v4" node_modules/phonegap-plugin-barcodescanner/plugin.xml

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Declare scanner AAR in app module (AGP 8 forbids local AAR in library modules)
        run: |
          # 1) plugins 项目的 fileTree 不再收集 .aar（bundleDebugAar 会因本地 aar 依赖失败）
          sed -i "s|fileTree(dir: 'src/main/libs', include: \['\*.jar', '\*.aar'\])|fileTree(dir: 'src/main/libs', include: ['*.jar'])|" android/capacitor-cordova-android-plugins/build.gradle
          grep -q "include: \['\*.jar'\]" android/capacitor-cordova-android-plugins/build.gradle
          # 2) 插件模块编译期以 compileOnly 引用 AAR（类只进编译 classpath，不进插件 AAR 输出）
          sed -i "s|implementation fileTree(dir: 'src/main/libs', include: \['\*.jar'\])|&\n    compileOnly files('src/main/libs/barcodescanner-release-2.1.5.aar')|" android/capacitor-cordova-android-plugins/build.gradle
          grep -q "compileOnly files('src/main/libs/barcodescanner-release-2.1.5.aar')" android/capacitor-cordova-android-plugins/build.gradle
          # 3) app 模块直接以文件形式依赖该 AAR（app 的 flatDir 已含插件 libs 路径）
          sed -i "s|implementation fileTree(include: \['\*.jar'\], dir: 'libs')|&\n    implementation files('../capacitor-cordova-android-plugins/src/main/libs/barcodescanner-release-2.1.5.aar')|" android/app/build.gradle
          grep -q "barcodescanner-release-2.1.5.aar" android/app/build.gradle

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: drug-inventory-apk
          path: android/app/build/outputs/apk/debug/*.apk
